<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freelance Tracker Pro</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- React and ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- SheetJS CDN for Multi-Tab Spreadsheet Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81' },
            peso: { 500: '#10b981', 600: '#059669' }
          }
        }
      }
    }
  </script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-invoice, #printable-invoice * { visibility: visible; }
      #printable-invoice { position: absolute; left: 0; top: 0; width: 100%; color: #000 !important; background: #fff !important; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-brand-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const DEFAULT_EXCHANGE_RATE = 58.50;

    const INITIAL_SHIFTS = [
      {
        id: '1',
        date: new Date().toISOString().split('T')[0],
        shiftType: 'Regular Shift',
        hours: 8.0,
        rate: 25.0,
        status: 'Paid',
        notes: 'Frontend UI component bug fixes and responsiveness testing.',
        tags: 'Frontend, React'
      },
      {
        id: '2',
        date: new Date(Date.now() - 86400000).toISOString().split('T')[0],
        shiftType: 'Overtime Shift',
        hours: 10.5,
        rate: 25.0,
        status: 'Pending',
        notes: 'API integration and database schema optimization.',
        tags: 'Backend, Node'
      }
    ];

    function App() {
      const [shifts, setShifts] = useState(() => {
        const saved = localStorage.getItem('ft_shifts');
        return saved ? JSON.parse(saved) : INITIAL_SHIFTS;
      });

      const [fxRate, setFxRate] = useState(() => {
        const saved = localStorage.getItem('ft_fx_rate');
        return saved ? parseFloat(saved) : DEFAULT_EXCHANGE_RATE;
      });

      const [selectedStatusFilter, setSelectedStatusFilter] = useState('ALL');
      const [searchTerm, setSearchTerm] = useState('');
      
      const [toast, setToast] = useState(null);

      const updateShiftStatus = (id, newStatus) => {
        setShifts(prev => prev.map(s => s.id === id ? { ...s, status: newStatus } : s));
        showToast(`Shift status updated to ${newStatus}`, 'info');
      };

      const bulkUpdateStatus = (newStatus) => {
        if (selectedShiftIds.length === 0) return;
        setShifts(prev => prev.map(s => selectedShiftIds.includes(s.id) ? { ...s, status: newStatus } : s));
        showToast(`Updated ${selectedShiftIds.length} shift(s) to ${newStatus}`, 'success');
      };

      const [otSettings, setOtSettings] = useState(() => {
        const saved = localStorage.getItem('ft_ot_settings');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (parsed.t1 && parsed.t1.hours !== undefined) return parsed;
          } catch(e) {}
        }
        return {
          t1: { rate: 1.25, hours: 2 },
          t2: { rate: 1.50, hours: 2 },
          t3: { rate: 2.00 }
        };
      });
      const [showOTSettings, setShowOTSettings] = useState(false);

      const showToast = (message, type = 'info') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Persistence
      useEffect(() => {
        localStorage.setItem('ft_shifts', JSON.stringify(shifts));
      }, [shifts]);

      useEffect(() => {
        localStorage.setItem('ft_fx_rate', fxRate.toString());
      }, [fxRate]);

      useEffect(() => {
        localStorage.setItem('ft_ot_settings', JSON.stringify(otSettings));
      }, [otSettings]);

      const [formData, setFormData] = useState({
        date: new Date().toISOString().split('T')[0],
        hours: '',
        rate: 25,
        status: 'Pending',
        notes: '',
        tags: ''
      });

      const calculateShiftTotals = (totalHours, baseRate, settings) => {
        if (totalHours <= 8) {
          return {
            totalUSD: totalHours * baseRate,
            breakdown: `${totalHours}hrs Regular`
          };
        }

        let earnings = 8 * baseRate; 
        let otHours = totalHours - 8;
        let breakdownParts = ['8hrs Reg'];
        
        if (otHours > 0) {
           let t1Hours = Math.min(otHours, settings.t1.hours);
           earnings += (t1Hours * baseRate * settings.t1.rate);
           breakdownParts.push(`${t1Hours}h @${settings.t1.rate}x`);
           otHours -= t1Hours;
        }

        if (otHours > 0) {
           let t2Hours = Math.min(otHours, settings.t2.hours);
           earnings += (t2Hours * baseRate * settings.t2.rate);
           breakdownParts.push(`${t2Hours}h @${settings.t2.rate}x`);
           otHours -= t2Hours;
        }

        if (otHours > 0) {
           earnings += (otHours * baseRate * settings.t3.rate);
           breakdownParts.push(`${otHours}h @${settings.t3.rate}x`);
        }

        return {
          totalUSD: earnings,
          breakdown: breakdownParts.join(' | ')
        };
      };

      const handleFormSubmit = (e) => {
        e.preventDefault();
        const parsedHours = parseFloat(formData.hours);
        const parsedRate = parseFloat(formData.rate) || 0;

        if (!formData.hours || parsedHours <= 0) {
          showToast('Please enter valid work hours.', 'error');
          return;
        }

        const { totalUSD, breakdown } = calculateShiftTotals(parsedHours, parsedRate, otSettings);
        const autoShiftType = parsedHours > 8 ? 'Overtime Shift' : 'Regular Shift';

        const newShift = {
          id: Date.now().toString(),
          date: formData.date || new Date().toISOString().split('T')[0],
          shiftType: autoShiftType,
          hours: parsedHours,
          rate: parsedRate,
          totalUSD: totalUSD,
          otBreakdown: breakdown,
          status: formData.status,
          notes: formData.notes,
          tags: formData.tags
        };

        setShifts(prev => [newShift, ...prev]);
        setFormData({
          date: new Date().toISOString().split('T')[0],
          hours: '',
          rate: formData.rate,
          status: 'Pending',
          notes: '',
          tags: ''
        });
        showToast('Shift added successfully!', 'success');
      };

      const [selectedShiftIds, setSelectedShiftIds] = useState([]);
      const [isInvoiceModalOpen, setIsInvoiceModalOpen] = useState(false);
      const [invoiceClient, setInvoiceClient] = useState('');
      const [deleteConfirmId, setDeleteConfirmId] = useState(null);

      // New Invoice Metadata States
      const [invPoNumber, setInvPoNumber] = useState('');
      const [invRips, setInvRips] = useState('');
      const [invPeriod, setInvPeriod] = useState('');

      const toggleSelectShift = (id) => {
        setSelectedShiftIds(prev => 
          prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]
        );
      };

      const selectAllShifts = () => {
        if (selectedShiftIds.length === filteredShifts.length) {
          setSelectedShiftIds([]);
        } else {
          setSelectedShiftIds(filteredShifts.map(s => s.id));
        }
      };

      const deleteShift = (id) => {
        setShifts(prev => prev.filter(s => s.id !== id));
        setSelectedShiftIds(prev => prev.filter(item => item !== id));
        setDeleteConfirmId(null);
        showToast('Shift removed.', 'info');
      };

      const filteredShifts = useMemo(() => {
        return shifts.filter(shift => {
          const matchesStatus = selectedStatusFilter === 'ALL' || shift.status === selectedStatusFilter;
          const matchesSearch = searchTerm === '' || 
            shift.notes.toLowerCase().includes(searchTerm.toLowerCase()) ||
            shift.shiftType.toLowerCase().includes(searchTerm.toLowerCase());
          return matchesStatus && matchesSearch;
        });
      }, [shifts, selectedStatusFilter, searchTerm]);

      const stats = useMemo(() => {
        const totalHours = filteredShifts.reduce((acc, s) => acc + s.hours, 0);
        const totalUSD = filteredShifts.reduce((acc, s) => acc + (s.totalUSD || (s.hours * s.rate)), 0);
        const pendingUSD = filteredShifts.filter(s => s.status === 'Pending').reduce((acc, s) => acc + (s.totalUSD || (s.hours * s.rate)), 0);
        const submittedUSD = filteredShifts.filter(s => s.status === 'Submitted').reduce((acc, s) => acc + (s.totalUSD || (s.hours * s.rate)), 0);
        const paidUSD = filteredShifts.filter(s => s.status === 'Paid').reduce((acc, s) => acc + (s.totalUSD || (s.hours * s.rate)), 0);
        const totalPHP = totalUSD * fxRate;
        const avgRate = totalHours > 0 ? totalUSD / totalHours : 0;

        return { totalHours, totalUSD, pendingUSD, submittedUSD, paidUSD, totalPHP, avgRate };
      }, [filteredShifts, fxRate]);

      const generateInvoiceNumber = () => {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const prefix = `INV-${yyyy}-${mm}-`;
        
        const existingInvoices = shifts
          .map(s => s.invoice?.invoiceNo)
          .filter(no => no && no.startsWith(prefix));
          
        const uniqueInvoices = [...new Set(existingInvoices)];
        
        let maxNum = 0;
        uniqueInvoices.forEach(inv => {
          const parts = inv.split('-');
          const num = parseInt(parts[3], 10);
          if (num > maxNum) maxNum = num;
        });
        
        const nextNum = String(maxNum + 1).padStart(3, '0');
        return `${prefix}${nextNum}`;
      };

      const submitInvoice = () => {
        const invNo = generateInvoiceNumber();
        
        setShifts(prev => prev.map(s => {
          if (selectedShiftIds.includes(s.id)) {
            return {
              ...s,
              status: 'Submitted',
              invoice: {
                invoiceNo: invNo,
                poNumber: invPoNumber || 'TBD',
                rips: invRips || 'N/A',
                period: invPeriod || 'Unspecified'
              }
            };
          }
          return s;
        }));

        showToast(`Invoice ${invNo} generated & attached to shifts!`, 'success');
        setIsInvoiceModalOpen(false);
        setSelectedShiftIds([]);
      };

      const handleExportCSV = () => {
        if (shifts.length === 0) {
          showToast('No data to export.', 'warning');
          return;
        }

        if (typeof XLSX === 'undefined') {
          showToast('Export library loading, please try again.', 'warning');
          return;
        }

        const workbook = XLSX.utils.book_new();

        // Grouping
        const uninvoicedByMonth = {};
        const invoicedGroups = {}; 

        const sortedShifts = [...shifts].sort((a, b) => new Date(a.date) - new Date(b.date));

        sortedShifts.forEach(shift => {
          if (shift.invoice && shift.invoice.invoiceNo) {
            const invNo = shift.invoice.invoiceNo;
            if (!invoicedGroups[invNo]) invoicedGroups[invNo] = [];
            invoicedGroups[invNo].push(shift);
          } else {
            let monthYearKey = 'Pending - Unspecified';
            try {
              const dateObj = new Date(shift.date);
              if (!isNaN(dateObj)) {
                monthYearKey = 'Pending - ' + dateObj.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
              }
            } catch(e) {}
            if (!uninvoicedByMonth[monthYearKey]) uninvoicedByMonth[monthYearKey] = [];
            uninvoicedByMonth[monthYearKey].push(shift);
          }
        });

        // 1. Process Invoiced Groups (PO separated tabs)
        Object.keys(invoicedGroups).forEach(invNo => {
          const group = invoicedGroups[invNo];
          const invData = group[0].invoice;
          
          let actualHours = 0;
          let amount = 0;
          let poEqHours = 0;
          
          group.forEach(s => {
            actualHours += s.hours;
            const sTotal = (s.totalUSD !== undefined ? s.totalUSD : (s.hours * s.rate));
            amount += sTotal;
            poEqHours += (sTotal / (s.rate || 1));
          });

          const domStatus = group.every(s => s.status === 'Paid') ? 'Paid' : 'Submitted';

          const aoa = [];
          aoa.push([`Invoice: ${invData.invoiceNo}`]);
          aoa.push([`PO: ${invData.poNumber}`]);
          aoa.push([`RIPS: ${invData.rips}`]);
          aoa.push([`Period: ${invData.period}`]);
          aoa.push([`Actual hours: ${actualHours.toFixed(2)}`]);
          aoa.push([`PO equivalent hours: ${poEqHours.toFixed(2)}`]);
          aoa.push([`Amount: $${amount.toFixed(2)}`]);
          aoa.push([`Status: ${domStatus}`]);
          aoa.push([]); // Empty row
          aoa.push(['Date', 'Task / Notes', 'Status', 'Total Hours', 'Base Rate ($)', 'Total Earned ($)', 'Est. Peso (PHP)', 'Overtime Breakdown']);
          
          group.forEach(s => {
             let formattedDate = s.date;
             try {
                const d = new Date(s.date);
                if(!isNaN(d)) formattedDate = d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
             } catch(e){}
             
             const sTotal = s.totalUSD !== undefined ? s.totalUSD : (s.hours * s.rate);
             aoa.push([
               formattedDate,
               s.notes || 'No notes',
               s.status,
               s.hours,
               s.rate,
               Number(sTotal.toFixed(2)),
               Number((sTotal * fxRate).toFixed(2)),
               s.otBreakdown || 'None'
             ]);
          });

          const worksheet = XLSX.utils.aoa_to_sheet(aoa);
          worksheet['!cols'] = [
            { wch: 14 }, { wch: 32 }, { wch: 12 }, { wch: 12 }, { wch: 14 }, { wch: 16 }, { wch: 16 }, { wch: 26 }
          ];
          
          let sheetName = invData.period || invData.poNumber || invNo;
          sheetName = sheetName.replace(/[:\\/?*\[\]]/g, '').slice(0, 30);
          XLSX.utils.book_append_sheet(workbook, worksheet, sheetName);
        });

        // 2. Process Uninvoiced Groups (Pending tabs)
        Object.keys(uninvoicedByMonth).forEach(monthKey => {
           const group = uninvoicedByMonth[monthKey];
           const aoa = [];
           aoa.push([monthKey.toUpperCase()]);
           aoa.push([]);
           aoa.push(['Date', 'Task / Notes', 'Status', 'Total Hours', 'Base Rate ($)', 'Total Earned ($)', 'Est. Peso (PHP)', 'Overtime Breakdown']);
           
           let totalHrs = 0;
           let totalUsd = 0;

           group.forEach(s => {
              let formattedDate = s.date;
              try {
                 const d = new Date(s.date);
                 if(!isNaN(d)) formattedDate = d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
              } catch(e){}
              
              totalHrs += s.hours;
              const sTotal = s.totalUSD !== undefined ? s.totalUSD : (s.hours * s.rate);
              totalUsd += sTotal;

              aoa.push([
                formattedDate,
                s.notes || 'No notes',
                s.status,
                s.hours,
                s.rate,
                Number(sTotal.toFixed(2)),
                Number((sTotal * fxRate).toFixed(2)),
                s.otBreakdown || 'None'
              ]);
           });
           
           aoa.push([]);
           aoa.push(['GRAND TOTAL', `Total Entries: ${group.length}`, '', Number(totalHrs.toFixed(2)), '', Number(totalUsd.toFixed(2)), Number((totalUsd * fxRate).toFixed(2)), '']);

           const worksheet = XLSX.utils.aoa_to_sheet(aoa);
           worksheet['!cols'] = [
            { wch: 14 }, { wch: 32 }, { wch: 12 }, { wch: 12 }, { wch: 14 }, { wch: 16 }, { wch: 16 }, { wch: 26 }
           ];
           let sheetName = monthKey.replace(/[:\\/?*\[\]]/g, '').slice(0, 30);
           XLSX.utils.book_append_sheet(workbook, worksheet, sheetName);
        });

        XLSX.writeFile(workbook, `Freelance_Tracker_${new Date().toISOString().split('T')[0]}.xlsx`);
        showToast('Exported structured spreadsheet with PO tabs!', 'success');
      };

      const fetchLiveExchangeRate = async () => {
        try {
          showToast('Fetching latest USD to PHP rate...', 'info');
          const res = await fetch('https://open.er-api.com/v6/latest/USD');
          const data = await res.json();
          if (data && data.rates && data.rates.PHP) {
            const newRate = +data.rates.PHP.toFixed(2);
            setFxRate(newRate);
            showToast(`Updated USD/PHP rate to ₱${newRate}`, 'success');
          } else {
            showToast('Could not auto-fetch rate. Please set manually.', 'warning');
          }
        } catch (e) {
          showToast('Network error fetching rate.', 'error');
        }
      };

      return (
        <div className="min-h-screen flex flex-col pb-16">
          {toast && (
            <div className={`fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 border transition-all animate-bounce ${
              toast.type === 'success' ? 'bg-emerald-950/90 border-emerald-500 text-emerald-200' :
              toast.type === 'error' ? 'bg-rose-950/90 border-rose-500 text-rose-200' :
              toast.type === 'warning' ? 'bg-amber-950/90 border-amber-500 text-amber-200' :
              'bg-slate-800/90 border-slate-600 text-slate-200'
            }`}>
              <i className={`fas ${
                toast.type === 'success' ? 'fa-check-circle text-emerald-400' :
                toast.type === 'error' ? 'fa-exclamation-triangle text-rose-400' :
                toast.type === 'warning' ? 'fa-exclamation-circle text-amber-400' :
                'fa-info-circle text-slate-400'
              }`}></i>
              <span className="text-sm font-medium">{toast.message}</span>
            </div>
          )}

          <header className="border-b border-slate-800 bg-slate-900/60 backdrop-blur-md sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center shadow-lg shadow-brand-500/20">
                  <i className="fas fa-bolt text-white text-lg"></i>
                </div>
                <div>
                  <h1 className="text-xl font-bold bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                    Freelance Tracker <span className="text-xs px-2 py-0.5 rounded-full bg-brand-500/20 text-brand-300 font-medium border border-brand-500/30">PRO</span>
                  </h1>
                  <p className="text-xs text-slate-400">Plan, Track, Invoice & Earn</p>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-3 text-xs">
                <div className="flex items-center gap-2 bg-slate-800/80 border border-slate-700/80 rounded-xl px-3 py-1.5 shadow-inner">
                  <span className="text-slate-400 font-semibold">1 USD =</span>
                  <div className="flex items-center">
                    <span className="text-emerald-400 font-bold mr-1">₱</span>
                    <input 
                      type="number" 
                      value={fxRate} 
                      onChange={(e) => setFxRate(parseFloat(e.target.value) || 0)}
                      step="0.1"
                      className="w-16 bg-transparent text-emerald-400 font-bold focus:outline-none"
                    />
                  </div>
                  <button 
                    onClick={fetchLiveExchangeRate}
                    title="Auto-fetch live USD/PHP rate"
                    className="text-slate-400 hover:text-brand-300 transition-colors p-1"
                  >
                    <i className="fas fa-sync-alt"></i>
                  </button>
                </div>

                <button 
                  onClick={handleExportCSV}
                  className="px-3 py-2 rounded-xl bg-slate-800 hover:bg-emerald-900/60 text-slate-300 hover:text-emerald-400 transition-colors border border-slate-700 hover:border-emerald-700 flex items-center gap-1.5"
                >
                  <i className="fas fa-file-csv"></i>
                  <span>Export to Sheets</span>
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full space-y-8">
            
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
              <div className="p-5 rounded-2xl bg-gradient-to-br from-slate-900 to-slate-800/90 border border-slate-800 shadow-xl relative overflow-hidden group">
                <div className="absolute -right-4 -bottom-4 w-20 h-20 bg-brand-500/10 rounded-full blur-xl group-hover:bg-brand-500/20 transition-all"></div>
                <div className="flex items-center justify-between mb-2">
                  <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Hours</span>
                  <div className="w-8 h-8 rounded-lg bg-brand-500/20 text-brand-400 flex items-center justify-center text-sm">
                    <i className="fas fa-clock"></i>
                  </div>
                </div>
                <div className="text-2xl font-extrabold text-white">{stats.totalHours.toFixed(2)} <span className="text-xs text-slate-400 font-normal">hrs</span></div>
                <div className="text-xs text-slate-400 mt-2">Avg Rate: <span className="text-slate-200 font-semibold">${stats.avgRate.toFixed(2)}/hr</span></div>
              </div>

              <div className="p-5 rounded-2xl bg-gradient-to-br from-slate-900 to-slate-800/90 border border-slate-800 shadow-xl relative overflow-hidden group">
                <div className="absolute -right-4 -bottom-4 w-20 h-20 bg-emerald-500/10 rounded-full blur-xl group-hover:bg-emerald-500/20 transition-all"></div>
                <div className="flex items-center justify-between mb-2">
                  <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Expected</span>
                  <div className="w-8 h-8 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-sm">
                    <i className="fas fa-dollar-sign"></i>
                  </div>
                </div>
                <div className="text-2xl font-extrabold text-emerald-400">${stats.totalUSD.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
                <div className="text-[11px] text-slate-400 mt-2 flex flex-wrap gap-x-2 gap-y-1">
                  <span>Pending: <strong className="text-amber-300">${stats.pendingUSD.toFixed(0)}</strong></span>
                  <span>Submitted: <strong className="text-sky-300">${stats.submittedUSD.toFixed(0)}</strong></span>
                  <span>Paid: <strong className="text-emerald-300">${stats.paidUSD.toFixed(0)}</strong></span>
                </div>
              </div>

              <div className="p-5 rounded-2xl bg-gradient-to-br from-slate-900 to-slate-800/90 border border-emerald-900/30 shadow-xl relative overflow-hidden group">
                <div className="absolute -right-4 -bottom-4 w-20 h-20 bg-teal-500/10 rounded-full blur-xl group-hover:bg-teal-500/20 transition-all"></div>
                <div className="flex items-center justify-between mb-2">
                  <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Est. in Peso</span>

                        <th className="py-2 px-2 text-right">Amount ($)</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {shifts.filter(s => selectedShiftIds.includes(s.id)).map(s => (
                        <tr key={s.id}>
                          <td className="py-2.5 px-2 text-slate-600 whitespace-nowrap">{s.date}</td>
                          <td className="py-2.5 px-2 font-medium text-slate-800">
                            {s.notes || s.shiftType}
                            {s.otBreakdown && <span className="block text-[10px] text-slate-400 mt-0.5 font-mono">{s.otBreakdown}</span>}
                          </td>
                          <td className="py-2.5 px-2 text-right text-slate-600 font-mono">{s.hours.toFixed(2)}</td>
                          <td className="py-2.5 px-2 text-right text-slate-600 font-mono">${s.rate.toFixed(2)}</td>
                          <td className="py-2.5 px-2 text-right font-bold font-mono text-slate-900">${(s.totalUSD !== undefined ? s.totalUSD : (s.hours * s.rate)).toFixed(2)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>

                  <div className="border-t-2 border-slate-200 pt-4 flex justify-end">
                    <div className="w-64 space-y-2 text-right">
                      {(() => {
                        const invShifts = shifts.filter(s => selectedShiftIds.includes(s.id));
                        const totalUSD = invShifts.reduce((acc, s) => acc + (s.totalUSD !== undefined ? s.totalUSD : (s.hours * s.rate)), 0);
                        const totalPHP = totalUSD * fxRate;
                        return (
                          <>
                            <div className="flex justify-between text-xs text-slate-600">
                              <span>Subtotal USD:</span>
                              <span className="font-mono font-bold">${totalUSD.toFixed(2)}</span>
                            </div>
                            <div className="flex justify-between text-xs text-slate-600">
                              <span>FX Rate (USD ➔ PHP):</span>
                              <span className="font-mono">₱{fxRate.toFixed(2)}</span>
                            </div>
                            <div className="flex justify-between text-base font-extrabold text-slate-900 border-t border-slate-200 pt-2">
                              <span>Total in PHP:</span>
                              <span className="text-emerald-700 font-mono">₱{totalPHP.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
                            </div>
                          </>
                        );
                      })()}
                    </div>
                  </div>

                  <div className="text-center text-[10px] text-slate-400 pt-6 border-t border-slate-100">
                    Thank you for your business! Please remit payment according to agreed contract terms.
                  </div>
                </div>

              </div>
            </div>
          )}

          {deleteConfirmId && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4">
                <div className="w-12 h-12 rounded-2xl bg-rose-500/20 text-rose-400 flex items-center justify-center text-xl mx-auto">
                  <i className="fas fa-exclamation-triangle"></i>
                </div>
                <div className="text-center">
                  <h3 className="text-base font-bold text-white">Delete Shift Record?</h3>
                  <p className="text-xs text-slate-400 mt-1">This action cannot be undone.</p>
                </div>
                <div className="flex items-center gap-3 pt-2">
                  <button 
                    onClick={() => setDeleteConfirmId(null)}
                    className="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-xs transition-colors"
                  >
                    Cancel
                  </button>
                  <button 
                    onClick={() => deleteShift(deleteConfirmId)}
                    className="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-medium text-xs transition-colors shadow-lg shadow-rose-600/30"
                  >
                    Confirm Delete
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
